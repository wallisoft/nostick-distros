name: Check the catalogue

# Runs on every change, and every Monday morning. Distro download links go stale whenever a new point release
# comes out, so the weekly run is what tells us: if a link has died, this fails and GitHub emails the owner.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every entry is well-formed and its download link is alive
        run: python3 check.py
